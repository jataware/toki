[project]
name = "toki"
version = "0.2.8"
description = "Minimal universal LLM interface API"
readme = "README.md"
authors = [
    { name = "David Samson", email = "david@jataware.com" }
]
requires-python = ">=3.10"
dependencies = [
    "typing-extensions>=4.15.0",
]

[project.optional-dependencies]
openrouter = ["requests>=2.32.5"]
local = ["torch>=2.0", "transformers>=4.40"]
openai = []
google = []
anthropic = []
ollama = []
all = ["toki[openrouter,local,openai,google,anthropic,ollama]"]

[project.urls]
"Repository" = "https://github.com/jataware/toki"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toki"]

[dependency-groups]
dev = [
    "easyrepl>=0.2.0",
]

[project.scripts]
# Developer utility to regenerate the OpenRouter models file
"toki-fetch-models" = "toki.openrouter.utils:_create_models_types_file"
