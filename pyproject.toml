[project]
name = "toki"
version = "1.3.4"
description = "Minimal universal LLM interface API"
readme = "README.md"
authors = [
    { name = "David Samson", email = "david@jataware.com" }
]
requires-python = ">=3.10"
dependencies = [
    "typing-extensions>=4.15.0",
]

[project.optional-dependencies]
openrouter = ["requests>=2.32.5", "httpx>=0.27"]
local = ["torch>=2.0", "transformers>=4.40"]
litellm = ["litellm>=1.52"]
openai = ["toki[litellm]"]
google = ["toki[litellm]", "google-genai>=1.0"]
anthropic = ["toki[litellm]"]
ollama = ["ollama>=0.6", "tqdm>=4"]
all = ["toki[openrouter,local,openai,google,anthropic,ollama]"]

[project.urls]
"Repository" = "https://github.com/jataware/toki"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toki"]

[tool.hatch.build.targets.wheel.force-include]
"toki/local/curated.txt" = "toki/local/curated.txt"

[dependency-groups]
dev = [
    "easyrepl>=0.2.0",
    # used by the toki-fetch-local-models codegen script
    "huggingface-hub>=0.20",
    "tqdm>=4",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-html>=4",
    "beautifulsoup4>=4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Share one event loop across all async tests in a session. Per-function loops
# (the pytest-asyncio default) cause litellm + httpx blow-ups: litellm caches
# a `module_level_aclient` whose connection pool ends up bound to whichever
# loop ran the first async call, and once that loop is torn down the next
# test sees `RuntimeError: Event loop is closed` when the pool tries to
# clean up stale connections via `loop.call_soon(...)`. Sharing the loop
# keeps the cached clients valid for the whole run.
asyncio_default_test_loop_scope = "session"
# `--html` is set dynamically by `tests/conftest.py:pytest_configure` to a
# timestamped file under `tests/results/`. We still want self-contained reports
# so they're a single portable file.
#
# `cache_integration` and `cost_integration`-marked tests hit real provider
# APIs and cost money per run, so we exclude them from the default suite. Run
# them explicitly with `pytest -m cache_integration` / `pytest -m cost_integration`.
addopts = [
    "-ra",
    "--strict-markers",
    "--self-contained-html",
    "-m", "not cache_integration and not cost_integration",
]
markers = [
    "cache_integration: hits real provider APIs to verify caching end-to-end (skipped by default; run with `pytest -m cache_integration`)",
    "cost_integration: hits real provider APIs for non-caching paths (e.g. online token counting); skipped by default (run with `pytest -m cost_integration`)",
]

[project.scripts]
# Developer utility to regenerate the OpenRouter models file
"toki-fetch-openrouter-models" = "toki.openrouter.fetch_models:_create_models_types_file"
# Developer utility to regenerate the HuggingFace local-chat-models file
"toki-fetch-local-models" = "toki.local.fetch_models:_create_models_types_file"
# Developer utilities to regenerate per-provider models files from litellm metadata
"toki-fetch-openai-models" = "toki.openai.fetch_models:_create_models_types_file"
"toki-fetch-anthropic-models" = "toki.anthropic.fetch_models:_create_models_types_file"
"toki-fetch-google-models" = "toki.google.fetch_models:_create_models_types_file"
# Developer utility to regenerate the Ollama models file from the ollama.com registry
"toki-fetch-ollama-models" = "toki.ollama.fetch_models:_create_models_types_file"
